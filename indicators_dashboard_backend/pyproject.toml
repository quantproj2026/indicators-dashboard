[project]
name = "indicators-dashboard-backend"
version = "1.0.0"
description = "FastAPI proxy for the Alpha Vantage economic indicators."
authors = [
    {name = "Theephop",email = "quantproj26@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.140.13,<0.141.0)",
    "uvicorn (>=0.52.0,<0.53.0)",
    "httpx (>=0.28,<0.29)",
    "pydantic-settings (>=2.7,<3.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.3,<9.0)",
    "pytest-asyncio (>=1.0,<2.0)",
    "respx (>=0.22,<0.23)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test module is async-heavy; opting in per-test would be noise.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:indicators_dashboard_backend.*"]
